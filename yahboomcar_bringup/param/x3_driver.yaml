driver_node:
  ros__parameters:
    car_type: X3
    imu_link: imu_link
    Prefix: ""
    serial_port: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
    xlinear_limit: 1.0
    ylinear_limit: 1.0
    angular_limit: 5.0
    cmd_vel_timeout: 0.5
    # 11 lines x 4 edges x 1:30 gearbox = 1320. Measured by hand-turning each
    # wheel 10 turns on splinter, 2026-10-30 (issue #69): 1313-1319.
    encoder_cpr: 1320.0
    # Validated on x3-c by isolated forward hand rotations on 2026-08-20.
    # Raw packet fields are zero-based m1..m4. Output is FL, FR, BL, BR.
    encoder_order: [0, 2, 1, 3]
    encoder_signs: [1.0, 1.0, 1.0, 1.0]
    encoder_max_delta_ticks: 5000
    # V3.3.9 auto-reports each packet class about every 40 ms. Cached getters
    # are never accepted as liveness; all three required report classes must
    # arrive and remain fresh.
    feedback_startup_timeout: 2.0
    feedback_timeout: 0.5
    # A 13-byte motion frame takes about 1 ms at 115200 baud. Bound a wedged
    # outbound syscall so failure diagnostics and strict shutdown can proceed.
    serial_write_timeout: 0.05
    # Leave enough time for an ERROR diagnostic to leave the process before
    # strict launch shuts down the rest of the graph.
    feedback_failure_exit_delay: 0.2
