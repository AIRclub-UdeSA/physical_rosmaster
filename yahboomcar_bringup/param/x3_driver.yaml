driver_node:
  ros__parameters:
    car_type: X3
    imu_link: imu_link
    Prefix: ""
    serial_port: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
    xlinear_limit: 1.0
    ylinear_limit: 1.0
    angular_limit: 5.0
    cmd_vel_timeout: 0.5
    encoder_cpr: 1040.0
    # Validated on x3-c by isolated forward hand rotations on 2026-08-20.
    # Raw packet fields are zero-based m1..m4. Output is FL, FR, BL, BR.
    encoder_order: [0, 2, 1, 3]
    encoder_signs: [1.0, 1.0, 1.0, 1.0]
    encoder_max_delta_ticks: 5000
    # Fail normal bringup instead of silently leaving a partial sensor graph.
    max_consecutive_read_failures: 10
