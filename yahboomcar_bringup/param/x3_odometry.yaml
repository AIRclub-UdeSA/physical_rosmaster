base_node:
  ros__parameters:
    wheel_radius: 0.0325
    wheelbase_x: 0.160
    wheelbase_y: 0.170
    odom_frame: odom
    base_footprint_frame: base_footprint
    joint_state_timeout: 0.5
    max_wheel_delta_rad: 20.0
    wheel_joint_names:
      - front_left_wheel_joint
      - front_right_wheel_joint
      - back_left_wheel_joint
      - back_right_wheel_joint
    linear_scale_x: 1.0
    linear_scale_y: 1.0
    angular_scale: 1.0
    # Provisional values: replace after repeated ground-truth floor trials.
    pose_covariance_x: 0.001
    pose_covariance_y: 0.001
    pose_covariance_yaw: 0.001
    twist_covariance_x: 0.0001
    twist_covariance_y: 0.0001
    twist_covariance_yaw: 0.0001
